services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Required}

    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"

    volumes:
      - minio_data:/data

    mem_limit: 1g
    memswap_limit: 2g


  api:
    build:
      context: .
      dockerfile: backend/Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      MINIO_ENDPOINT: minio:9000

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      - minio

    mem_limit: 512m


  api2:
    build:
      context: .
      dockerfile: backend/Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      MINIO_ENDPOINT: minio:9000

    expose:
      - "8000"

    depends_on:
      - minio

    mem_limit: 512m


  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      API_URL: http://caddy:8080

    depends_on:
      - caddy

    mem_limit: 256m


  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    environment:
      API_DOMAIN: ${API_DOMAIN:?Required}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - api


volumes:
  minio_data:
  caddy_data:
  caddy_config: